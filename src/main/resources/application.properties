# --- DATABASE CONNECTION SETTINGS ---
# Note: Using localhost:5433 for local dev; Docker uses service name risk-postgres:5432
spring.datasource.url=jdbc:postgresql://localhost:5433/risk_treatment_db
spring.datasource.username=risk_user
spring.datasource.password=risk_password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA & HIBERNATE CONFIG ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.generate_statistics=true

# --- MIGRATION SETTINGS ---
spring.flyway.enabled=true

# --- SECURITY & JWT CONFIG ---
jwt.secret=mysecretkeymysecretkeymysecretkey12
jwt.expiration=3600000
# P2 Hotfix: Strict validation for internship/placement standard security
security.jwt.strict-validation=true
# Day 19 Fix: Ensure public path is recognized for health checks
spring.security.permit-all-paths=/actuator/health

# --- DAY 16 & 19 P1/P2 STABILITY FIXES ---
# Prevents Database Connection Exhaustion (P1)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=2000

# Connection Timeout & Retry Logic (P1/P2)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.validation-timeout=5000
server.error.include-message=always

# --- ACTUATOR & MONITORING ---
server.port=8080

management.endpoint.health.show-details=always


# P1 Fix: Allow health check to be public for monitoring/verification
management.endpoints.web.exposure.include=health
management.endpoint.health.proactive-setup-enabled=true
# Ensure security doesn't block the actuator path
spring.security.permit-all-paths=/actuator/health