spring.datasource.url=jdbc:postgresql://localhost:5433/risk_treatment_db
spring.datasource.username=risk_user
spring.datasource.password=risk_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

jwt.secret=mysecretkeymysecretkeymysecretkey12
jwt.expiration=3600000

# Show the SQL queries in the terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Show a summary of how long queries took and how many ran
spring.jpa.properties.hibernate.generate_statistics=true

# --- DAY 16 BUG FIXES ---
# P1 Fix: Prevent Database Connection Exhaustion
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# P2 Fix: Prevent API Hanging/Timeout
spring.datasource.hikari.connection-timeout=20000
server.error.include-message=always