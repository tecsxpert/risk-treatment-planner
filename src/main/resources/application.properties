server.port=8080

# Database Configuration (Points to Docker container)
spring.datasource.url=jdbc:postgresql://postgres:5432/risk_treatment_db
spring.datasource.username=risk_user
spring.datasource.password=risk_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis Configuration (Points to Docker container)
spring.data.redis.host=redis
spring.data.redis.port=6379

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Settings (Removed hardcoded credentials so it shares the main datasource)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Security (Pulls from .env via docker-compose)
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Test profile
spring.config.activate.on-profile=!test