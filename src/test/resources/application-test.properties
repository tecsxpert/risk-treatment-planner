# 1. Switch to H2 In-Memory Database (No Docker Required)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Hibernate Settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# 3. Disable services that require external containers
spring.flyway.enabled=false
spring.data.redis.repositories.enabled=false

# 4. Mock JWT Secret for tests
jwt.secret=mysecretkeymysecretkeymysecretkey12

# No demo bulk seed in tests (deterministic counts / isolation)
app.demo.seed-risks=false
jwt.expiration=3600000