<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entity Created</title>
</head>
<body>
    <h2>New Entity Created</h2>
    <p>Hello,</p>
    <p>A new entity has been created with the following details:</p>
    <ul>
        <li><strong>Name:</strong> <span th:text="${name}"></span></li>
        <li><strong>Description:</strong> <span th:text="${description}"></span></li>
        <li><strong>Date:</strong> <span th:text="${date}"></span></li>
    </ul>
    <p>Thank you.</p>
</body>
</html>
