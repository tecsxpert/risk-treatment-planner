version: '3.8'

services:
  # 1. PostgreSQL Database Service
  risk-postgres:
    image: postgres:15-alpine
    container_name: risk-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Redis Cache Service
  risk-redis:
    image: redis:7-alpine
    container_name: risk-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. PgAdmin (Database Viewer UI)
  pgadmin:
    image: dpage/pgadmin4
    container_name: risk-pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      risk-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/misc/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 4. Spring Boot Backend API
  risk-backend:
    build: .
    container_name: risk-backend
    env_file:
      - .env
    environment:
      # P3 Fix: Optimized JVM for faster startup in container environments
      - JAVA_OPTS=-XX:+TieredCompilation -XX:TieredStopAtLevel=1
      - SPRING_DATASOURCE_URL=jdbc:postgresql://risk-postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=risk-redis
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      risk-postgres:
        condition: service_healthy
      risk-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: on-failure

  # 5. Frontend Placeholder
  risk-frontend:
    image: nginx:alpine
    container_name: risk-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      risk-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data: